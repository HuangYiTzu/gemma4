# mlp_link.cfg -- v++ link settings for the Gemma-4-E2B MLP accelerator
#                 (Alveo U280, 3 SLRs, 32 HBM pseudo-channels)
#
# Usage in the Vitis IDE: hw_link project -> binary_container_1 -> V++ options:
#     --config /absolute/path/to/mlp_link.cfg
# Command line:  v++ -l ... --config mlp_link.cfg
#
# NINE compute units out of four kernels (see the CU map in kernel.h):
#
#   mlp_ctrl_1        mlp_ctrl     SLR0      x_q / r_g / r_u -> 3 control lanes
#   mlp_mover_1..4    mlp_mover    SLR0      8 HBM ports each, 1 weight lane
#                                            per engine; CU j owns HBM[8j..8j+7]
#                                            and engine lane j
#   mlp_engine_1/2/3  mlp_engine   SLR0/1/2  one MAC array each, free-running
#                                            (ap_ctrl_none: stream ports only,
#                                            the host never enqueues them)
#   mlp_collect_1     mlp_collect  SLR0      adds the three partial-sum lanes,
#                                            applies c_down, writes y_q
#
# A kernel is ONE placement unit, which is why the engines have to be separate
# compute units: this is what actually puts a MAC array in SLR1 and SLR2 while
# every HBM master stays in SLR0.  The SAME argument is why the mover is four
# CUs now -- see "PLACEMENT AND ROUTING" at the bottom of this file.
#
# IDE FLOW (default): the hw_link project's "Hardware Functions" table creates
# the compute units, so the nk= lines below stay COMMENTED OUT -- two sources of
# nk= for the same kernel clash.  Add all FOUR kernels to that table and set the
# Compute Units column of mlp_mover to 4 and of mlp_engine to 3; the IDE then
# names the CUs mlp_ctrl_1 / mlp_mover_1..4 / mlp_engine_1..3 / mlp_collect_1,
# exactly the names every sp=, slr= and stream_connect= below refers to.
#
# PURE v++ FLOW: uncomment the four nk= lines.

kernel_frequency=200


[connectivity]
#nk=mlp_ctrl:1:mlp_ctrl_1
#nk=mlp_mover:4:mlp_mover_1.mlp_mover_2.mlp_mover_3.mlp_mover_4
#nk=mlp_engine:3:mlp_engine_1.mlp_engine_2.mlp_engine_3
#nk=mlp_collect:1:mlp_collect_1

# ---------------------------------------------------------------------------
# Memory: only the SLR0 kernels touch global memory
# ---------------------------------------------------------------------------
# 32 weight pseudo-channels: one AXI master per HBM bank, all in SLR0, split
# into four CONTIGUOUS blocks of 8.  Every CU calls its ports w_hbm_0..w_hbm_7
# (the kernel has no CU index); the four blocks below are the only thing that
# makes CU j different from CU j+1.
#
# The blocks are contiguous on purpose.  hmss_0's slave slots sit next to the
# banks they serve, so a CU bound to HBM[0..7] is pulled to the left of SLR0
# and one bound to HBM[24..31] to the right -- which is exactly the horizontal
# spread the SLL columns need.  Total masters: 4 x 8 = 32, still inside the
# 33-slot limit noted below.
sp=mlp_mover_1.w_hbm_0:HBM[0]
sp=mlp_mover_1.w_hbm_1:HBM[1]
sp=mlp_mover_1.w_hbm_2:HBM[2]
sp=mlp_mover_1.w_hbm_3:HBM[3]
sp=mlp_mover_1.w_hbm_4:HBM[4]
sp=mlp_mover_1.w_hbm_5:HBM[5]
sp=mlp_mover_1.w_hbm_6:HBM[6]
sp=mlp_mover_1.w_hbm_7:HBM[7]

sp=mlp_mover_2.w_hbm_0:HBM[8]
sp=mlp_mover_2.w_hbm_1:HBM[9]
sp=mlp_mover_2.w_hbm_2:HBM[10]
sp=mlp_mover_2.w_hbm_3:HBM[11]
sp=mlp_mover_2.w_hbm_4:HBM[12]
sp=mlp_mover_2.w_hbm_5:HBM[13]
sp=mlp_mover_2.w_hbm_6:HBM[14]
sp=mlp_mover_2.w_hbm_7:HBM[15]

sp=mlp_mover_3.w_hbm_0:HBM[16]
sp=mlp_mover_3.w_hbm_1:HBM[17]
sp=mlp_mover_3.w_hbm_2:HBM[18]
sp=mlp_mover_3.w_hbm_3:HBM[19]
sp=mlp_mover_3.w_hbm_4:HBM[20]
sp=mlp_mover_3.w_hbm_5:HBM[21]
sp=mlp_mover_3.w_hbm_6:HBM[22]
sp=mlp_mover_3.w_hbm_7:HBM[23]

sp=mlp_mover_4.w_hbm_0:HBM[24]
sp=mlp_mover_4.w_hbm_1:HBM[25]
sp=mlp_mover_4.w_hbm_2:HBM[26]
sp=mlp_mover_4.w_hbm_3:HBM[27]
sp=mlp_mover_4.w_hbm_4:HBM[28]
sp=mlp_mover_4.w_hbm_5:HBM[29]
sp=mlp_mover_4.w_hbm_6:HBM[30]
sp=mlp_mover_4.w_hbm_7:HBM[31]

# control-plane vectors.  x_q / r_g / r_u share mlp_ctrl's gmemS bundle and
# c_down / y_q the collector's gmemC bundle, so each bundle needs ONE bank.
# Deliberately NOT on HBM: the platform's HBM subsystem (hmss_0) has 33 slave
# slots and the platform itself holds at least one, so the 32 w_hbm_* above
# plus another HBM master fails with
#   VPL-1: You have run out of port connections on /hmss_0
#
# PLRAM, NOT DDR[0].  These vectors used to live in DDR[0], and that one choice
# made v++ build a complete DDR4 memory controller in SLR0 -- util_hier.rpt of
# the failed build: memory_subsystem = 30,002 LUT, 40,108 FF, 70 RAMB36, plus
# its own 30,388-load div_clk net -- to hold ~114 KB, in the SLR that was
# already at 95 % CLB.  PLRAM is on-chip memory the platform exposes as a
# global-memory bank, so it needs no external controller.
#
# U280 (xilinx_u280_gen3x16_xdma_1_202211_1): PLRAM[0..5], 128 KB each,
# 512-bit, two per SLR; PLRAM[0] and PLRAM[1] are both in SLR0, next to the
# two kernels that use them.  One bundle per bank:
#   gmemS  x_q 6 KB + r_g 48 KB + r_u 48 KB = 102 KB  -> PLRAM[0]
#   gmemC  c_down 6 KB + y_q 6 KB           =  12 KB  -> PLRAM[1]
# All five would fit one 128 KB bank on paper (114 KB), but XRT rounds each
# buffer up to its allocation granule, which leaves too little margin; two
# banks also keep mlp_ctrl and mlp_collect off each other's port.
#
# The host needs no change: it creates these buffers without a bank flag, and
# XRT places each one in the bank its kernel argument is connected to.
#
# After the next build, confirm the DDR4 controller is really gone: util_hier
# (report_utilization -hierarchical) should show memory_subsystem at a fraction
# of the 30 k LUT above.  If it is still there, the platform keeps DDR[0]
# regardless and this move saves nothing -- revert to the DDR[0] lines below.
sp=mlp_ctrl_1.x_q:PLRAM[0]
sp=mlp_ctrl_1.r_g:PLRAM[0]
sp=mlp_ctrl_1.r_u:PLRAM[0]
sp=mlp_collect_1.c_down:PLRAM[1]
sp=mlp_collect_1.y_q:PLRAM[1]
#sp=mlp_ctrl_1.x_q:DDR[0]
#sp=mlp_ctrl_1.r_g:DDR[0]
#sp=mlp_ctrl_1.r_u:DDR[0]
#sp=mlp_collect_1.c_down:DDR[0]
#sp=mlp_collect_1.y_q:DDR[0]

# ---------------------------------------------------------------------------
# CU-to-CU AXI4-Streams
#
#   weights : 4 movers x 1 lane x 512 bit per engine = 4 lanes = 256 B/cycle
#             per SLR crossing, the width the SLL budget in kernel.h is built
#             on.  (8 lanes / 512 B/cycle up to the eighth Hardware build;
#             kernel.h, "FOUR LANES PER ENGINE", has why and what it costs.)
#             Mover CU j drives engine lane j, which carries HBM
#             pseudo-channels 8j..8j+7 -- exactly the block CU j reads (the
#             lane-to-channel formula is in mlp_common.h).
#   control : 1 lane x 512 bit from mlp_ctrl_1, x_q + this engine's r_g / r_u
#             slice per token.
#   psum    : 1 lane x 32 bit back to the collector.  The depth (1536+) lets a
#             fast engine dump a whole token's partial sums without waiting for
#             its neighbours, so the lockstep collector can never deadlock a
#             mover through a full weight FIFO.
#
# DEPTH 512 ON THE WEIGHT LANES.
#   1) THE ENGINE'S DOUBLE BUFFER USED TO LIVE HERE.  mlp_engine no longer
#      runs its job loop as a DATAFLOW region (the ping-pong working set was
#      13-35 % of the cells in the congested windows of the failed builds), so
#      it loads a job and then computes it, on ONE buffer.  With 8 lanes a
#      gate/up job was 192 addresses x MLP_WSUB = 2 words = 384 words per lane,
#      so a 512-deep FIFO held a whole job: the movers prefetched it during
#      compute and the engine then loaded it at II=2, faster than the movers'
#      II=3.  With 4 lanes a job is 192 x 4 = 768 words per lane (a down job
#      512) and no longer fits -- but it does not have to: the movers (mv_beat)
#      and the engine's load loop now BOTH need 4 cycles per address, so a
#      prefetched job would not load any faster.  Depth 512 stays because it
#      costs the same BRAM as 128 (below).
#   2) The four movers have no common beat counter.  They self-align through
#      back-pressure (an engine's recv_addr reads all four lanes for every
#      address), and the FIFOs absorb the start-up skew of four independent
#      clEnqueueTask calls.
#   3) A BRAM FIFO has a register stage at each end, which cuts the SLR
#      crossing in two.
#
# Cost: NOTHING extra over the old depth of 128.  A BRAM36's native shape is
# 512 deep x 72 bit, so a 512-bit FIFO is 7 RAMB36 + 1 RAMB18 at depth 128
# and at depth 512 alike (util_hier.rpt of the failed build: 7 + 1 per
# buffer_mlp_mover_* at depth 128) -- depth 128 simply wasted 3/4 of it.
#
# The failed build showed ZERO Laguna TX_REG / RX_REG at depth 128, so the
# FIFO end registers are not being promoted into the SLR-crossing sites;
# depth does not change that.  Check after a rebuild with
#     grep -A2 "Using Both TX_REG" slr_util_placed.rpt
# ---------------------------------------------------------------------------
stream_connect=mlp_ctrl_1.ctrl0:mlp_engine_1.ctrl:32
stream_connect=mlp_ctrl_1.ctrl1:mlp_engine_2.ctrl:32
stream_connect=mlp_ctrl_1.ctrl2:mlp_engine_3.ctrl:32

# mover 1  ->  HBM[0..7]    ->  engine lane 0
stream_connect=mlp_mover_1.w0_0:mlp_engine_1.w_0:512
stream_connect=mlp_mover_1.w1_0:mlp_engine_2.w_0:512
stream_connect=mlp_mover_1.w2_0:mlp_engine_3.w_0:512

# mover 2  ->  HBM[8..15]   ->  engine lane 1
stream_connect=mlp_mover_2.w0_0:mlp_engine_1.w_1:512
stream_connect=mlp_mover_2.w1_0:mlp_engine_2.w_1:512
stream_connect=mlp_mover_2.w2_0:mlp_engine_3.w_1:512

# mover 3  ->  HBM[16..23]  ->  engine lane 2
stream_connect=mlp_mover_3.w0_0:mlp_engine_1.w_2:512
stream_connect=mlp_mover_3.w1_0:mlp_engine_2.w_2:512
stream_connect=mlp_mover_3.w2_0:mlp_engine_3.w_2:512

# mover 4  ->  HBM[24..31]  ->  engine lane 3
stream_connect=mlp_mover_4.w0_0:mlp_engine_1.w_3:512
stream_connect=mlp_mover_4.w1_0:mlp_engine_2.w_3:512
stream_connect=mlp_mover_4.w2_0:mlp_engine_3.w_3:512

stream_connect=mlp_engine_1.ps:mlp_collect_1.ps0:2048
stream_connect=mlp_engine_2.ps:mlp_collect_1.ps1:2048
stream_connect=mlp_engine_3.ps:mlp_collect_1.ps2:2048

# ---------------------------------------------------------------------------
# Placement: one engine per SLR, everything that touches memory in SLR0
# (HBM, PLRAM[0] and PLRAM[1] are all in SLR0 on the U280)
# ---------------------------------------------------------------------------
slr=mlp_ctrl_1:SLR0
slr=mlp_mover_1:SLR0
slr=mlp_mover_2:SLR0
slr=mlp_mover_3:SLR0
slr=mlp_mover_4:SLR0
slr=mlp_engine_1:SLR0
slr=mlp_engine_2:SLR1
slr=mlp_engine_3:SLR2
slr=mlp_collect_1:SLR0

# ---------------------------------------------------------------------------
# Build parallelism (the command-line --jobs is deprecated, v++ 60-1600).
# [hls]   jobs        : HLS syntheses run in parallel (one per kernel)
# [vivado] synth.jobs : parallel Vivado out-of-context synthesis runs
# [vivado] impl.jobs  : parallel jobs inside place & route
# Only the Hardware (and partly Emulation-HW) build uses these; each job wants
# several GB of RAM, so keep the number at or below the machine's core count.
# ---------------------------------------------------------------------------
[hls]
jobs=8

[vivado]
synth.jobs=8
impl.jobs=8

# ---------------------------------------------------------------------------
# PLACEMENT AND ROUTING
#
# Two Hardware builds failed in route_design with
#   ERROR: [VPL 35-3] Design is not routable as its global congestion level is 7
# The first one was blamed on SLL column balance alone, which is why the mover
# was split four ways.  report_design_analysis on the second build's
# routed_error.dcp showed that was only part of it:
#
#   o) Every level-7 congestion window in EVERY SLR is led by that SLR's
#      engine -- the MAC pipeline (compute_job ... job_ktile_job_kstep, 34-65 %
#      of the cells in the window) and the jbuf ping-pong (13-35 %).  In SLR1
#      and SLR2 those windows are only ~50 % LUT / ~30 % FF, so they are full
#      of WIRES, not of logic.  mlp_engine.cpp answers with two structural
#      changes: no DATAFLOW (one working set, 128 URAM, no ping-pong select --
#      the 512-deep FIFOs above take over the double buffering) and a 24-lane
#      MAC array instead of 32 (1536 DSPs instead of 2048).  Two other ideas
#      were tried and dropped: a free-running pipeline for the 49 k / 68 k-load
#      control nets (HLS disables frp on a loop without blocking I/O,
#      HLS 200-1553), and a DSP cascade for the K sum (written in HLS C++ it
#      does not become a cascade; measured, see job_drain in mlp_engine.cpp).
#   o) SLR0 was at 95 % CLB.  The DDR4 controller is gone (PLRAM above), and
#      the placer directive is back to the congestion-driven one below.
#   o) The platform's static shell is a vertical strip in clock-region column
#      X7 (and part of X6) through all three SLRs, with ~10.8 k pre-routed
#      SLLs of its own.  The over-subscribed SLL columns sit right next to it,
#      so the movers are now kept off X6/X7 (mover_pblocks.tcl).
#
#
# The THIRD build got past that (initial congestion level 6, every net routed)
# and failed with 9,024 routing-node conflicts (Constraints 18-1000).  Its
# report_design_analysis / route_status / high_fanout.rpt gave three causes,
# answered as follows:
#   o) Input-pin (IMUX) conflicts at the MAC DSPs.  HLS had built every
#      accumulator as DSP -> fabric copy + two muxes -> DSP C port (49,152
#      LUT/FF and a 49,152-load control net per engine).  The accumulators are
#      now an RTL blackbox that keeps P inside the DSP (mlp_dsp_mac.v); this is
#      a COMPILE-side change -- mlp_engine must be compiled with
#      mlp_engine_compile.cfg.
#   o) SLL column 7 of SLR0/1 at 169 %: mover_3 had one narrow clock-region
#      column.  The movers are now split by SLICE column, four equal shares
#      of X0..X5 (mover_pblocks.tcl, part A).
#   o) Engine 2 sat on the SLR1 Laguna row where the SLR0 crossings land
#      (SLR1 "South Long" level 7).  It is now kept above the bottom
#      clock-region row of SLR1 (mover_pblocks.tcl, part B).
#
# The FOURTH build routed cleanly (0 overlaps, verification passed) and failed
# the write_bitstream timing check instead:
#   ERROR: [VPL 101-2] ... unscalable system clocks did not meet their
#          required target frequency ... dma_ip_axi_aclk_1; slack: -0.354 ns
# The platform's PCIe clock (250 MHz) cannot be scaled down, so one miss there
# stops the build, and it also stopped the automatic scaling of our kernel
# clock, which was at -5.317 ns (it would have been scaled to ~95 MHz).  The
# timing reports show the same shape on both clocks -- ONE register driving
# hundreds of loads spread far apart, 95-99 % of the path being wire:
#   o) DMA clock: the SLR2 end of the host->HBM register slice
#      (hmss_0/.../slice0_12, fanout 525) and the host data SmartConnect
#      (axi_data_sc, fanout 1050), platform IP at the bottom of SLR2.
#   o) Kernel clock: the sign bit of each activation q[kl] driving 704 DSP B
#      pins (64 DSPs x 11 sign-extended pins), a 10.4 ns wire.
# The placer had estimated all of it as fine (post-place WNS +0.004 ns), so
# the post-place phys_opt did nothing, and after routing it was too late.
# Three answers, items 4-6 below:
#   A1) mlp_replicate.tcl marks exactly those drivers (74 nets) with
#       FORCE_MAX_FANOUT before placement, and the placer replicates them so
#       each copy serves a nearby cluster (item 4);
#   A2) phys_opt runs AggressiveExplore after placement AND again after
#       routing, on real wire delays (item 5);
#   A3) engine 3 leaves the bottom clock-region row of SLR2 to the SLL landing
#       traffic and that platform logic, like engine 2 in SLR1
#       (mover_pblocks.tcl, part B') -- SWITCHED OFF after the seventh build,
#       but only really off from the ninth build on, see below.
#
# The SIXTH build (the fifth crashed inside Vivado, a segfault in the DRC
# before opt_design) failed route_design again, with 1,390 overlaps.  The
# cause was the first version of A1: its name patterns were far too broad,
# matched 1,153 nets on the real netlist (all 32 HBM slices, SmartConnect
# resets, every bit of every q) and phys_opt added 9,083 registers AFTER
# placement, next to the DSP columns and the HBM interface.  The SLR partition
# (Place 30-356: 18,293 SLLs for SLR0/1) and the post-place WNS were the same
# as the fourth build's -- which says which SLR every cell went to, NOT that
# the detailed placement was identical.  A1 was rewritten (item 4): exact
# target names, a safety cap, a dry-run mode, and replication done BY THE
# PLACER.
#
# The SEVENTH build showed the new A1 doing exactly what it should (74 nets
# marked, 674 copies made by the placer, placement otherwise identical to the
# sixth build) and route_design still failed, with 1,046 overlaps, mostly in
# the centre of SLR0 under SLL column 7.  The SLL demand of the sixth and
# seventh builds is the same and worse than the fourth's (SLR0-1 column 7
# 162 % vs 113 %, SLR1-2 column 11 154 % vs 112 %), and the one placement
# constraint those two share and the fourth lacks is A3.  A3 is therefore
# switched off (engine 3 skip count 0 in mover_pblocks.tcl); A1 and A2 stay.
#
# The EIGHTH build was meant to test exactly that, but the build machine still
# had the previous mover_pblocks.tcl: its runme.log printed
#     MLP-PBLOCK: pb_mlp_engine_3 -> ... rows Y9..Y11 ... (bottom 1 row(s) left
# so it re-ran the seventh build and failed the same way (router iteration 1
# down to 15 overlaps, iteration 2 back up to 475 k, 1,045 left; SLL table
# identical).  A3 has therefore NOT been tested yet.  Its reports also showed
# where the demand comes from: the weight lanes are ~90 % of the kernel's
# SLR0 -> SLR1 crossing, and all of them run vertically through SLR0, where the
# router estimated "South Long" congestion at level 7 on 33 % of the tiles.
#
# The NINTH build therefore changes two things at once:
#   o) A3 really off -- copy the current mover_pblocks.tcl to the build
#      machine (it prints its version on the first MLP-PBLOCK line);
#   o) 4 weight lanes per engine instead of 8 (kernel.h, FOUR LANES PER
#      ENGINE; mlp_mover and mlp_engine MUST be recompiled): SLR0/1 kernel
#      crossing 9,320 -> 5,208 SLL, SLR1/2 4,660 -> 2,604, lane wires through
#      SLR0 12,288 -> 6,144 bit.  Cost: +4.6 k .. +9.2 k cycles per token.
# If it routes, which of the two did it is unknown; 8 lanes + A3 off can be
# tried later to buy the throughput back.
#
# HOW TO CHECK A NEW BUILD EARLY.  Within the first hour, place_design's
# pre-hook prints what it constrained -- check it BEFORE waiting for routing:
#     grep MLP- runme.log
# (ninth build: the version line, "mlp_engine_3: skip rows = 0, left
# unconstrained", "engine pblocks in effect: pb_mlp_engine_2", and
# "kernel_q_sign 72 nets").  About two hours in, Phase 3.1 prints the
# per-column SLL demand:
#     grep -A3 "Estimated SLL Demand Per Column" runme.log
# and the placer has already printed its congestion estimate:
#     grep -A56 "Post-Placement Estimated Congestion" runme.log
# If every SLR still shows 128x128 there, the build will not route.
# ---------------------------------------------------------------------------

# 1) THE PBLOCKS (mover_pblocks.tcl -- the name is historical, it now places
#    engines 2 and 3 too).
#    Vivado nests them under pblock_dynamic_region, and each one really does
#    hold its whole CU (util_pblock.rpt: pb_mlp_mover_1 = 11,877 LUT, the
#    exact size of mlp_mover_1).  Part A splits the SLICE columns WEST of the
#    static strip (X0..X5) into four equal shares, one per mover; part B keeps
#    mlp_engine_2 out of the bottom clock-region row of SLR1 (74.0 % DSP inside
#    its pblock).  Part B' does the same for mlp_engine_3 in SLR2 but is
#    switched off since the seventh build (skip count 0; the eighth build ran
#    a stale copy, so the ninth is the first one really without it).
#    Part C sources mlp_replicate.tcl from the same directory (item 4).  The
#    header of the script has the reasoning; grep runme.log for MLP-PBLOCK.
#
#    >>> The path must be the ABSOLUTE path to mover_pblocks.tcl ON THE BUILD
#    >>> MACHINE.  A wrong path fails impl_1 at PLACE_DESIGN, i.e. AFTER
#    >>> synthesis has already run.  Check it before starting a build.
prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.PRE=/home/undergraduate/yckao25/gemma4_MLP_temp/mover_pblocks.tcl

# 2) THE PLACER DIRECTIVE: AltSpreadLogic_high.
#    It spreads logic out to lower the local wiring density, at the price of
#    somewhat longer wires.  The second build tried SSI_SpreadSLLs instead,
#    which only looks after the SLR-crossing bundles; SLR0 went from 91.85 %
#    to 95.03 % CLB and the congestion did not improve, so the spreading one
#    is back.  It does not fix a level-7 design on its own (the first build
#    used it and still failed) -- it is here to stop SLR0 packing tighter while
#    the engine changes do the real work.
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=AltSpreadLogic_high

# 3) THE ROUTER DIRECTIVE: AlternateCLBRouting, unchanged.  It targets CLBs
#    with high pin utilisation ([Route 35-445]: 709 of them in the last build).
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AlternateCLBRouting

# 4) REPLICATION OF THE FEW NETS THAT FAILED TIMING (mlp_replicate.tcl, A1).
#    NO LINE OF ITS OWN ANY MORE: mover_pblocks.tcl (item 1) sources it from
#    its own directory, because Vivado takes only one pre-place hook.  Copy
#    mlp_replicate.tcl next to mover_pblocks.tcl on the build machine.
#
#    It marks exactly 74 nets with FORCE_MAX_FANOUT -- the two platform
#    registers that start 29 of the 30 worst DMA-clock paths, and the sign bit
#    of each activation register (24 lanes x 3 engines) that starts every
#    worst kernel path -- and place_design replicates them while it can still
#    move their loads.  It refuses to mark anything if more than 100 nets
#    match.  Grep runme.log for MLP-REPL (the list it marked) and, inside
#    place_design, "Physopt 32-81" (copies per net; ~10 each in a local test,
#    so ~700 new registers in total -- the first version added 9,083).
#
#    The first version ran here, after placement:
#        prop=run.impl_1.STEPS.PLACE_DESIGN.TCL.POST=<abs>/mlp_replicate.tcl
#    and is what failed the sixth build.  Keep that line OUT of this file.
#
#    To check the list on the real netlist before a build, open the fourth
#    build's level0_wrapper_routed.dcp in Vivado and run
#        set MLP_REP_DRYRUN 1
#        source <abs>/mlp_replicate.tcl
#    It should report 1 + 1 + 72 = 74 nets and mark nothing.

# 5) AGGRESSIVE PHYSICAL OPTIMISATION, AFTER PLACEMENT AND AFTER ROUTING (A2).
#    Post-place phys_opt ran for 1:39 min in the fourth build and changed
#    nothing, because the placer's estimate said timing was met.
#    AggressiveExplore replicates, re-places and retimes more eagerly and
#    includes the SLR-crossing optimisation -- the third kind of failing DMA
#    path was a single register-to-register hop from SLR0 to SLR1 inside the
#    host->HBM slice (slack -0.278 ns), which replication cannot shorten.
#    Post-route phys_opt was not part of the run at all (only the router's own
#    physical-synthesis phase, which stopped at -0.354 ns); it now runs on the
#    REAL routed delays.  Cost: roughly 30-90 min more implementation time.
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
